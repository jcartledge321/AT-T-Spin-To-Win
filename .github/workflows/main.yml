<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AT&T Spin To Win</title>

<style>
:root{
  --navy:#0057a8;
  --blue:#067fc7;
  --cyan:#10a8dd;
  --ink:#003b70;
  --panel:#f4f7fb;
  --line:#b9def4;
  --white:#fff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial;
  color:var(--ink);
  background:linear-gradient(120deg,#07549c,#009fde);
  min-height:100vh;
}

button,input,textarea,select{
  font:inherit;
}

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:#d9e6f5cc;
  backdrop-filter:blur(12px);
  border-bottom:1px solid #fff8;
}

.bar{
  max-width:1060px;
  margin:auto;
  height:70px;
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 20px;
}

.brand{
  font-weight:800;
  font-size:18px;
  display:flex;
  align-items:center;
  gap:10px;
}

.globe{
  width:34px;
  height:34px;
  border:3px solid #00a8e0;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:#00a8e0;
}

.nav{
  display:flex;
  gap:8px;
}

.nav button,
.btn{
  border:1px solid #0c72c6;
  background:white;
  color:#004b87;
  border-radius:9px;
  padding:9px 14px;
  font-weight:700;
  cursor:pointer;
}

.nav button:hover,
.btn:hover{
  filter:brightness(.97);
}

.nav button.active,
.btn.primary{
  color:white;
  background:#0864c7;
}

.present{
  margin-left:auto;
}

.wrap{
  max-width:980px;
  margin:26px auto;
  padding:0 18px 60px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.empty{
  max-width:520px;
  margin:55px auto;
  background:#f7f8fb;
  border:1px dashed #81bce4;
  border-radius:16px;
  padding:34px;
  text-align:center;
}

.empty h1{
  font-size:25px;
}

.card{
  background:#f7f9fc;
  border:1px solid #d8e8f4;
  border-radius:16px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 5px 16px #003b7014;
}

.card h2{
  margin:0 0 16px;
  font-size:21px;
}

.muted{
